name: Issue 18 Browser Verification
run-name: Issue 18 - ${{ inputs.mode }}
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Controlled equal-size and equal-mtime reproduction
        required: true
        default: buggy
        type: choice
        options:
          - buggy
          - compat
          - checksum
permissions:
  contents: write
concurrency:
  group: sync-upstream
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'wuzihe/2fa-issue18-repro'
    runs-on: ubuntu-latest
    env:
      UPSTREAM_REPO: wuzf/2fa
      UPSTREAM_REF: main
      MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Clone real upstream and preserve deployment config
        run: |
          git clone --depth=1 --branch "$UPSTREAM_REF" "https://github.com/$UPSTREAM_REPO.git" ../upstream
          cp wrangler.toml /tmp/local-wrangler.toml
          git -C ../upstream rev-parse HEAD
      - name: Recreate the reported size and timestamp collision
        run: |
          git show a41057d53ea965af639fafc905c4054d0fa5ad15:src/utils/version.js > src/utils/version.js
          git show a41057d53ea965af639fafc905c4054d0fa5ad15:scripts/build-release.js > scripts/build-release.js
          python3 - <<'PY'
          import base64, os, pathlib
          patches = {"scripts/merge-wrangler-config.js":"","scripts/sync-upstream-compat.js":""}
          if os.environ['MODE'] == 'compat':
              for name, contents in patches.items():
                  pathlib.Path('../upstream', name).write_bytes(base64.b64decode(contents))
          for name in ['src/utils/version.js', 'scripts/build-release.js']:
              local = pathlib.Path(name)
              upstream = pathlib.Path('../upstream', name)
              assert local.stat().st_size == upstream.stat().st_size, name
              assert local.read_bytes() != upstream.read_bytes(), name
              for path in [local, upstream]:
                  os.utime(path, (1700000000, 1700000000))
              print(name, 'bytes=', local.stat().st_size, 'mtime=', local.stat().st_mtime)
          PY
      - name: Sync files using the legacy command or checksum fix
        run: |
          if [ "$MODE" = checksum ]; then
            rsync -a --checksum --delete --exclude '.git/' ../upstream/ ./
          else
            rsync -a --delete --exclude '.git/' ../upstream/ ./
          fi
      - name: Run the original Merge deployment config entry point
        run: |
          node scripts/merge-wrangler-config.js /tmp/local-wrangler.toml wrangler.toml wrangler.toml
      - name: Verify complete application contents and preserved deployment identity
        run: |
          git diff --exit-code HEAD -- .github/workflows/
          python3 - <<'PY'
          import json, os, pathlib, subprocess, tomllib, hashlib
          names = subprocess.check_output(['git', '-C', '../upstream', 'ls-files', '-z']).decode().split('\0')
          mismatches = []
          for name in filter(None, names):
              if name == 'wrangler.toml' or name.startswith('.github/workflows/'):
                  continue
              local, source = pathlib.Path(name), pathlib.Path('../upstream', name)
              if not local.exists() or local.read_bytes() != source.read_bytes():
                  mismatches.append(name)
          expected = ['scripts/build-release.js', 'src/utils/version.js'] if os.environ['MODE'] == 'buggy' else []
          assert sorted(mismatches) == sorted(expected), mismatches
          local = tomllib.loads(pathlib.Path('/tmp/local-wrangler.toml').read_text())
          merged = tomllib.loads(pathlib.Path('wrangler.toml').read_text())
          assert merged['name'] == local['name'] == '2fa-issue18-repro'
          assert merged['kv_namespaces'] == local['kv_namespaces']
          assert merged['env']['development']['name'] == local['env']['development']['name']
          package = json.loads(pathlib.Path('package.json').read_text())['version']
          version = next(line for line in pathlib.Path('src/utils/version.js').read_text().splitlines() if line.startswith('export const APP_VERSION'))
          result = {'mode': os.environ['MODE'], 'package_version': package, 'application_version': version, 'mismatched_files': mismatches, 'worker_and_kv_config_preserved': True, 'workflow_unchanged': True}
          print(json.dumps(result, indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('\n### Controlled browser verification\n\n'+json.dumps(result, indent=2)+'\n')
          PY
      - name: Commit and push using the unchanged legacy logic
        run: |
          if git diff --quiet --exit-code; then
            echo "No upstream changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: issue 18 $MODE result"
          git push
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
